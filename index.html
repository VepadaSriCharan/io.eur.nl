<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access</title>
    <style>
        /* Hacker-style terminal aesthetics */
        body {
            background-color: #000000;
            color: #00ff00; /* Matrix green */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .terminal {
            text-align: center;
            border: 2px solid #00ff00;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px #00ff00; /* Glowing effect */
        }
        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2em;
            color: #a9ffa9;
        }
        /* Blinking cursor effect */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #00ff00;
            animation: blink 1s step-end infinite;
            vertical-align: bottom;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="terminal">
        <h1>Access Granted</h1>
        <p>Hi, I am an Ethical Hacker<span class="cursor"></span></p>
    </div>

</body>
</html>
